# Keeps the workflows' actions at their newest releases: the workflows pin each action to a commit SHA with its tag in a comment, and Dependabot
# opens a pull request that moves both when an action publishes a new release.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    groups:
      actions:
        patterns: ['*']
